apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgbouncer.fullname" . }}
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pgbouncer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/pgbouncerConfig: {{ .Values.pgbouncer | toJson | sha256sum }}
        checksum/extraConfigs: {{ .Values.extraConfigs | toJson | sha256sum }}
        checksum/extraSecretConfigs: {{ .Values.extraSecretConfigs | toJson | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pgbouncer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pgbouncer.serviceAccountName" . }}
      # Pod security Standards compliance - explicitly deny host access
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-pgbouncer-config
        - secretRef:
            name: {{ .Values.extraSecretConfigsSecretName }}
        ports:
        - containerPort: {{ .Values.service.port }}
        volumeMounts:
        - name: conf-volume
          mountPath: /opt/bitnami/pgbouncer/conf/
        - name: logs-volume
          mountPath: /opt/bitnami/pgbouncer/logs/
        - name: tmp-volume
          mountPath: /opt/bitnami/pgbouncer/tmp/
        {{- if .Values.tls.enabled }}
        - name: tls-secret
          mountPath: /etc/pgbouncer/tls
          readOnly: true
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: conf-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
      {{- if .Values.tls.enabled }}
      - name: tls-secret
        secret:
          secretName: {{ .Values.tls.certificatesSecret }}
      {{- end }}
